<line x1="205" y1="31" x2="210" y2="35" stroke="#007F83" stroke-width="0.7"/>
<line x1="205" y1="39" x2="210" y2="35" stroke="#007F83" stroke-width="0.7"/>
<text x="225" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#18364B">291 indexed records</text>
<text x="12" y="58" font-family="Arial, sans-serif" font-size="9.5" font-weight="normal" fill="#18364B">Titles and bodies; the same searchable records for all five configurations.</text>
